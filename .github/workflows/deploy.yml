name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    uses: OpenAEC-Foundation/github/.github/workflows/deploy-site.yml@main
    with:
      deploy_host: ${{ vars.DEPLOY_HOST }}
      deploy_port: ${{ vars.DEPLOY_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
      # Bestaande nginx-site en HTTPS-configuratie: deploy/nginx.conf.
      deploy_path: /var/www/open-parafrase-weergave.nl
      deploy_source: .
      # Zoekindex en vindbare leespagina's uit dezelfde openbare leeseditie.
      build_command: |
        python -m pip install 'reportlab>=4.4,<5' 'fonttools[woff]>=4.60,<5'
        python scripts/build_search_index.py --editie nl-opv
        python scripts/build_leespaginas.py
        python scripts/build_downloads.py
      rsync_excludes: |
        .git/
        .github/
        .claude/
        .gitignore
        CLAUDE.md
        README.md
        deploy/
        scripts/
        tests/
        docs/
        data/edities/
    secrets:
      deploy_ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
